<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inference-net</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#e6edf3; --muted:#8b949e;
          --accent:#f7931a; --good:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:10px; }
  header h1 { font-size:16px; margin:0; }
  header .tag { color:var(--accent); font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:320px 1fr; gap:0; height:calc(100vh - 51px); }
  #hosts { border-right:1px solid var(--line); overflow:auto; padding:12px; }
  #hosts .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  #hosts h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .host { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px;
          cursor:pointer; }
  .host:hover { border-color:var(--accent); }
  .host.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .host .name { font-weight:600; }
  .host .meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .host .rep { font-size:12px; margin-top:4px; }
  .host .rep .ok { color:var(--good); } .host .rep .new { color:var(--muted); }
  .host .bond { color:var(--muted); font-size:11px; margin-top:3px; }
  .host .pk { color:var(--muted); font-size:11px; font-family:monospace; }
  #chat { display:flex; flex-direction:column; padding:16px 20px; overflow:hidden; }
  #out { flex:1; overflow:auto; white-space:pre-wrap; background:var(--panel);
         border:1px solid var(--line); border-radius:8px; padding:14px; font-size:14px; }
  #out .err { color:var(--bad); }
  #status { color:var(--muted); font-size:12px; min-height:18px; margin:8px 2px; }
  #status b { color:var(--accent); }
  .compose { display:flex; gap:8px; margin-top:10px; }
  .compose textarea { flex:1; resize:vertical; min-height:56px; background:var(--panel);
                      color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px;
                      font:inherit; }
  .compose .side { display:flex; flex-direction:column; gap:8px; width:120px; }
  .compose label { font-size:11px; color:var(--muted); }
  .compose input { width:100%; background:var(--panel); color:var(--fg);
                   border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1><span class="tag">inference-net</span> client</h1>
  <span class="sub">Lightning-native AI inference · pay per token</span>
</header>
<main>
  <section id="hosts">
    <div class="bar"><h2>Hosts</h2><button id="refresh">Refresh</button></div>
    <div id="hostlist"></div>
  </section>
  <section id="chat">
    <div id="out"></div>
    <div id="status"></div>
    <div class="compose">
      <textarea id="prompt" placeholder="Type a prompt…">Explain Lightning in one sentence.</textarea>
      <div class="side">
        <div><label>max tokens</label><input id="maxtok" type="number" value="64" min="1" max="2048"></div>
        <button id="send" class="primary">Send</button>
      </div>
    </div>
  </section>
</main>

<script>
let hosts = [], selected = null, busy = false;
const $ = id => document.getElementById(id);

function sat(msat) { return (msat / 1000).toFixed(0); }

async function loadHosts() {
  $("hostlist").innerHTML = '<div class="meta">discovering…</div>';
  try {
    const r = await fetch("/api/hosts");
    hosts = (await r.json()).hosts || [];
  } catch (e) { hosts = []; }
  if (!hosts.length) {
    $("hostlist").innerHTML = '<div class="meta">No hosts found. Start a host, or relax POW_MIN_DIFFICULTY.</div>';
    selected = null; return;
  }
  if (!selected || !hosts.find(h => h.pubkey === selected)) selected = hosts[0].pubkey; // best-ranked
  render();
}

function render() {
  $("hostlist").innerHTML = "";
  for (const h of hosts) {
    const el = document.createElement("div");
    el.className = "host" + (h.pubkey === selected ? " sel" : "");
    const rep = h.reputation;
    const repHtml = rep && rep.attempts
      ? `<span class="ok">${Math.round((rep.success_rate ?? 0) * 100)}% ok</span> · ${rep.attempts} tries`
        + (rep.ewma_latency_ms ? ` · ${(rep.ewma_latency_ms / 1000).toFixed(1)}s` : "")
      : `<span class="new">new — no history yet</span>`;
    el.innerHTML =
      `<div class="name">${h.model.name}</div>`
      + `<div class="meta">${sat(h.model.price_msat_per_token)} sat/token · ctx ${h.model.context_window}</div>`
      + `<div class="rep">${repHtml}</div>`
      + (h.bond_txid ? `<div class="bond">bond ${h.bond_txid.slice(0,16)}… (advisory)</div>` : "")
      + `<div class="pk">${h.pubkey.slice(0,24)}…</div>`;
    el.onclick = () => { if (!busy) { selected = h.pubkey; render(); } };
    $("hostlist").appendChild(el);
  }
}

async function send() {
  if (busy || !selected) return;
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  busy = true; $("send").disabled = true;
  $("out").textContent = ""; $("out").classList.remove("err");
  $("status").innerHTML = "paying & streaming…";
  let spent = 0;
  try {
    const resp = await fetch("/api/infer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host_pubkey: selected, prompt, max_tokens: +$("maxtok").value || 64 }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "token") {
          $("out").textContent += ev.text;
          $("out").scrollTop = $("out").scrollHeight;
        } else if (ev.type === "done") {
          spent = ev.spent_msat;
          $("status").innerHTML = `done · spent <b>${sat(spent)} sat</b> (${spent} msat) · ${(ev.latency_ms/1000).toFixed(1)}s`;
        } else if (ev.type === "error") {
          $("out").classList.add("err");
          $("out").textContent += "\n[error] " + ev.message;
          $("status").textContent = "failed";
        }
      }
    }
  } catch (e) {
    $("out").classList.add("err"); $("out").textContent += "\n[error] " + e;
    $("status").textContent = "failed";
  } finally {
    busy = false; $("send").disabled = false;
    loadHosts();  // refresh reputation after the run
  }
}

$("refresh").onclick = loadHosts;
$("send").onclick = send;
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
});
loadHosts();
</script>
</body>
</html>
