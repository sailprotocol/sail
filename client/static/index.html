<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAIL</title>
<link rel="stylesheet" href="sail.css">
<style>
  /* client — page layout; design tokens + components from sail.css */
  header{height:62px; display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; background:rgba(10,14,21,0.85); backdrop-filter:blur(10px);}
  header h1{font-family:'Bricolage Grotesque'; font-weight:800; font-size:1.15rem; margin:0;}
  header .tag{color:var(--beacon);}
  header .sub{color:var(--muted); font-size:0.78rem;}
  .drawertoggle{display:none; align-items:center; justify-content:center; width:40px; height:40px; padding:0; font-size:1.1rem;}

  main{display:grid; grid-template-columns:320px 1fr; height:calc(100vh - 63px);}
  #side{border-right:1px solid var(--line); overflow:auto; display:flex; flex-direction:column; background:var(--ink);}
  .sec{padding:14px; border-bottom:1px solid var(--line);}
  .sec .bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .sec h2{font-family:'IBM Plex Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:0;}

  /* buttons: neutral by default, .primary = beacon, .link = text (matches sail.css .btn system) */
  button{font-family:'Bricolage Grotesque'; font-weight:700; font-size:0.84rem; background:var(--ink-3); color:var(--fg); border:1px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer; transition:all .15s;}
  button:hover{border-color:var(--beacon);} button:disabled{opacity:.45; cursor:not-allowed;}
  button.primary{background:var(--beacon); color:#1a0f02; border-color:var(--beacon);} button.primary:hover{background:var(--beacon-2);}
  button.link{background:none; border:none; color:var(--muted); padding:4px 6px; font-weight:600;} button.link:hover{color:var(--beacon);}

  .host,.hist{border:1px solid var(--line); border-radius:11px; padding:12px; margin-bottom:9px; cursor:pointer; background:var(--ink-2); transition:border-color .15s;}
  .host:hover,.hist:hover{border-color:#2c3a4b;}
  .host.sel{border-color:var(--beacon); background:#13192180; box-shadow:0 0 0 1px var(--beacon-deep) inset;}
  .host .name{font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--fg);}
  .hist .name{font-weight:600;}
  .host .meta,.hist .meta{color:var(--muted); font-size:0.78rem; margin-top:4px;}
  .host .rep{font-size:0.78rem; margin-top:5px;} .host .rep .ok{color:var(--good);} .host .rep .new{color:var(--muted);}
  .host .bond,.host .pk{color:var(--muted); font-size:0.7rem; margin-top:4px;} .host .pk{font-family:'IBM Plex Mono',monospace;}
  .hist{position:relative;} .hist .preview{margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hist .x{position:absolute; top:2px; right:2px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--muted); border-radius:8px;}
  .hist .x:hover{color:var(--bad); background:var(--ink-3);}

  #chat{display:flex; flex-direction:column; padding:18px 20px; overflow:hidden; min-width:0;}
  #out{flex:1; overflow:auto; background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:16px;}
  #out .you{color:var(--beacon); font-weight:600; margin-bottom:12px; white-space:pre-wrap;}
  #out .md{line-height:1.6;} #out .md.err{color:var(--bad); white-space:pre-wrap;}
  #out .md p{margin:0 0 10px;} #out .md h1,#out .md h2,#out .md h3{font-family:'Bricolage Grotesque'; margin:14px 0 8px;}
  #out .md ul,#out .md ol{margin:0 0 10px 22px;}
  #out .md code{font-family:'IBM Plex Mono',monospace; background:var(--code-bg); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:0.82rem;}
  #out .md pre{background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto;}
  #out .md pre code{background:none; border:none; padding:0;}
  #notice{color:var(--beacon-2); font-size:0.82rem; min-height:18px; margin:9px 2px 0;}
  #status{color:var(--muted); font-size:0.78rem; min-height:18px; margin:5px 2px;} #status b{color:var(--beacon); font-family:'IBM Plex Mono',monospace;}
  .compose{display:flex; gap:9px; margin-top:8px;}
  .compose textarea{flex:1; resize:vertical; min-height:58px; background:var(--ink-2); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:11px; font-family:inherit; font-size:0.9rem;}
  .compose textarea:focus{outline:none; border-color:var(--beacon);}
  .compose .side2{display:flex; flex-direction:column; gap:8px; width:130px;}
  .compose label{font-size:0.7rem; color:var(--muted);}
  .compose input{width:100%; background:var(--ink-2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; font-family:'IBM Plex Mono',monospace; font-size:0.85rem;}
  .compose input:focus{outline:none; border-color:var(--beacon);}
  #walletbody input{width:100%; background:var(--code-bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; font-family:'IBM Plex Mono',monospace; font-size:0.82rem; margin-bottom:7px;}
  #walletbody .ok{color:var(--good); font-weight:600;} #walletbody .note{color:var(--muted); font-size:0.72rem; margin-top:6px;}
  #walletbody .pk{font-family:'IBM Plex Mono',monospace;}

  /* mobile: stack to one column, hosts/history slide in as a drawer */
  #drawerscrim{display:none;}
  @media (max-width:760px){
    main{grid-template-columns:1fr;}
    .drawertoggle{display:inline-flex;}
    #side{position:fixed; top:63px; bottom:0; left:0; width:min(330px,86vw); transform:translateX(-100%); transition:transform .2s ease; z-index:60; box-shadow:0 0 40px rgba(0,0,0,.55);}
    body.drawer-open #side{transform:translateX(0);}
    #drawerscrim{position:fixed; inset:63px 0 0 0; background:rgba(5,8,12,.6); z-index:50;}
    body.drawer-open #drawerscrim{display:block;}
    #chat{height:calc(100vh - 63px);}
  }
</style>
</head>
<body>
<header>
  <button class="drawertoggle" id="drawertoggle" aria-label="Show hosts &amp; history">☰</button>
  <h1><span class="tag">SAIL</span> client</h1>
  <span class="sub">Lightning-native AI inference · pay per token</span>
</header>
<main>
  <section id="side">
    <div class="sec" id="walletsec" style="display:none">
      <div class="bar"><h2>Wallet</h2></div>
      <div id="walletbody"></div>
    </div>
    <div class="sec">
      <div class="bar"><h2>Hosts</h2><button id="refresh">Refresh</button></div>
      <div id="hostlist"></div>
    </div>
    <div class="sec">
      <div class="bar"><h2>History</h2><button id="clearhist" class="link">Clear</button></div>
      <div id="histlist"></div>
    </div>
  </section>
  <section id="chat">
    <div id="out"></div>
    <div id="notice"></div>
    <div id="status"></div>
    <div class="compose">
      <textarea id="prompt" placeholder="Type a prompt…  (Ctrl/Cmd+Enter to send)">Explain Lightning in one sentence.</textarea>
      <div class="side2">
        <div><label>max tokens</label><input id="maxtok" type="number" value="64" min="1" max="2048"></div>
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
          <input id="bolt11toggle" type="checkbox"> BOLT11 (any wallet)</label>
        <button id="send" class="primary">Send</button>
        <button id="cancel" class="ghost" style="display:none">Cancel</button>
      </div>
    </div>
  </section>
</main>
<div id="drawerscrim"></div>

<script>
let hosts = [], selected = null, busy = false;
let walletConnected = false, payments = "mock";  // set by loadWallet(); drives auto pay-mode
let inflight = null;  // AbortController for the in-flight inference (so Cancel can abort it)
const $ = id => document.getElementById(id);
const hostIsTor = pk => { const h = hosts.find(x => x.pubkey === pk); return !!(h && /\.onion(:\d+)?$/.test(h.endpoint || "")); };
const ntokens = s => (s.trim() ? s.trim().split(/\s+/).length : 0);  // rough live token count
const sat = msat => (msat / 1000).toFixed(0);
const ago = ts => { const d = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (d < 60) return d + "s ago"; if (d < 3600) return Math.floor(d/60) + "m ago";
  if (d < 86400) return Math.floor(d/3600) + "h ago"; return Math.floor(d/86400) + "d ago"; };

// --- minimal, safe markdown (escape first, then a small subset) ---
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function mdToHtml(src){
  const blocks = [];
  src = src.replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
    return '␀B' + (blocks.length - 1) + '␀';
  });
  src = escapeHtml(src)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.split('\n');
  let html = '', list = null;
  const close = () => { if (list) { html += '</' + list + '>'; list = null; } };
  for (const line of lines) {
    const t = line.trim(); let m;
    if (/^␀B\d+␀$/.test(t)) { close(); html += blocks[+t.slice(2, -1)]; continue; }
    if (m = line.match(/^(#{1,6})\s+(.*)$/)) { close(); html += `<h${m[1].length}>${m[2]}</h${m[1].length}>`; continue; }
    if (m = line.match(/^\s*[-*]\s+(.*)$/)) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${m[1]}</li>`; continue; }
    if (m = line.match(/^\s*\d+\.\s+(.*)$/)) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${m[1]}</li>`; continue; }
    if (t === '') { close(); continue; }
    close(); html += `<p>${line}</p>`;
  }
  close();
  return html;
}

function renderConversation(prompt, responseText, isError) {
  $("out").innerHTML = `<div class="you">${escapeHtml(prompt)}</div>`
    + `<div class="md${isError ? ' err' : ''}">${isError ? escapeHtml(responseText) : mdToHtml(responseText)}</div>`;
  $("out").scrollTop = $("out").scrollHeight;
}

// --- hosts ---
async function loadHosts() {
  $("hostlist").innerHTML = '<div class="meta">discovering…</div>';
  try { hosts = (await (await fetch("/api/hosts")).json()).hosts || []; } catch { hosts = []; }
  if (!hosts.length) { $("hostlist").innerHTML = '<div class="meta">No hosts found. Start a host, or relax POW_MIN_DIFFICULTY.</div>'; selected = null; return; }
  if (!selected || !hosts.find(h => h.pubkey === selected)) selected = hosts[0].pubkey;
  renderHosts();
}
// Connection-bar helper: the derived alias for a pubkey (falls back to a short pubkey).
function aliasOf(pk) { const h = hosts.find(x => x.pubkey === pk); return h ? h.alias_label : (pk || "").slice(0, 8) + "…"; }
function renderHosts() {
  $("hostlist").innerHTML = "";
  for (const h of hosts) {
    const el = document.createElement("div");
    el.className = "host" + (h.pubkey === selected ? " sel" : "");
    const r = h.reputation;
    const rep = r && r.attempts
      ? `<span class="ok">${Math.round((r.success_rate ?? 0) * 100)}% ok</span> · ${r.attempts} tries`
        + (r.ewma_latency_ms ? ` · ${(r.ewma_latency_ms / 1000).toFixed(1)}s` : "")
      : `<span class="new">new — no history yet</span>`;
    el.innerHTML = `<div class="name">${h.alias_label}</div>`
      + `<div class="meta">${h.model.name} · ${sat(h.model.price_msat_per_token)} sat/token · ctx ${h.model.context_window}</div>`
      + `<div class="rep">${rep}</div>`
      + (h.bond_txid ? `<div class="bond">bond ${h.bond_txid.slice(0,16)}… (advisory)</div>` : "")
      + `<div class="pk" title="host pubkey — the only thing that decides identity">${h.pubkey.slice(0,24)}…</div>`;
    el.onclick = () => { if (!busy) { selected = h.pubkey; renderHosts(); } };
    $("hostlist").appendChild(el);
  }
}

// --- history ---
async function loadHistory() {
  let sessions = [];
  try { sessions = (await (await fetch("/api/history")).json()).sessions || []; } catch {}
  if (!sessions.length) { $("histlist").innerHTML = '<div class="meta">No past sessions.</div>'; return; }
  $("histlist").innerHTML = "";
  for (const s of sessions) {
    const el = document.createElement("div");
    el.className = "hist";
    el.innerHTML = `<button class="link x" title="delete">✕</button>`
      + `<div class="name">${s.model}</div>`
      + `<div class="meta">${ago(s.created_at)} · ${sat(s.spent_msat)} sat</div>`
      + `<div class="meta preview">${escapeHtml(s.prompt)}</div>`;
    el.onclick = () => openHistory(s.id);
    el.querySelector(".x").onclick = async (e) => { e.stopPropagation(); await fetch(`/api/history/${s.id}`, {method:"DELETE"}); loadHistory(); };
    $("histlist").appendChild(el);
  }
}
async function openHistory(id) {
  if (busy) return;
  const s = await (await fetch(`/api/history/${id}`)).json();
  if (!s || s.error) return;
  renderConversation(s.prompt, s.response || "", false);
  $("notice").textContent = "";
  $("status").innerHTML = `past session · ${s.model} · spent <b>${sat(s.spent_msat)} sat</b> · ${(s.latency_ms/1000).toFixed(1)}s · ${ago(s.created_at)}`;
}
$("clearhist").onclick = async () => { await fetch("/api/history", {method:"DELETE"}); loadHistory(); };

// BOLT11 fallback: show the invoice (amount + QR + copyable string) until the first token arrives.
function showInvoice(prompt, ev) {
  const sats = sat(ev.amount_msat);
  $("status").innerHTML = "⏳ waiting for payment…";
  $("out").innerHTML =
    `<div class="you">${escapeHtml(prompt)}</div>`
    + `<div class="md" style="text-align:center">`
    + `<p>Pay <b>${sats} sat</b> from any Lightning wallet</p>`
    + (ev.qr_svg ? `<img alt="invoice QR" src="${ev.qr_svg}" style="max-width:260px;background:#fff;padding:8px;border-radius:8px">` : "")
    + `<p style="word-break:break-all;font-family:monospace;font-size:11px;color:var(--muted)">${escapeHtml(ev.bolt11)}</p>`
    + `<button id="copyinv">Copy invoice</button>`
    + `<p class="note" style="color:var(--muted)">Strike, BlueWallet, Phoenix — any wallet. Streams automatically once paid.</p>`
    + `</div>`;
  const btn = document.getElementById("copyinv");
  if (btn) btn.onclick = () => { navigator.clipboard.writeText(ev.bolt11); btn.textContent = "Copied ✓"; };
}

// --- send / stream ---
async function send() {
  if (busy || !selected) return;
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  busy = true; $("send").disabled = true; $("cancel").style.display = "";
  // Auto-pick mode: NWC connected -> metered; else BOLT11. The toggle forces BOLT11.
  const mode = ($("bolt11toggle").checked || (payments === "nwc" && !walletConnected))
    ? "bolt11" : "metered";

  // live progress — so a 25–125s Tor inference shows movement, not dead air
  const tor = hostIsTor(selected);
  const t0 = Date.now();
  let tokens = 0, spent = 0, lastBeat = Date.now(), finished = false;
  const secs = () => Math.floor((Date.now() - t0) / 1000);
  function paint() {
    if (finished) return;  // a terminal handler set the final line; don't overwrite
    if (tokens > 0) {
      $("status").innerHTML = `${aliasOf(selected)} · streaming · <b>${tokens}</b> tok · <b>${sat(spent)}</b> sat · ${secs()}s`;
    } else if (Date.now() - lastBeat > 12000) {
      $("status").innerHTML = `${aliasOf(selected)} · still waiting… (first token can take 10–60s over Tor) · ${secs()}s`;
    } else {
      $("status").innerHTML = `${aliasOf(selected)} · ${tor ? "routing over Tor" : "contacting host"}… · ${secs()}s`;
    }
  }
  $("notice").textContent = tor ? "Routing over Tor — the first token can take 10–60s. Silence here is normal." : "";
  paint();
  const ticker = setInterval(paint, 500);

  let buf = "";
  renderConversation(prompt, "", false);
  inflight = new AbortController();
  try {
    const resp = await fetch("/api/infer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host_pubkey: selected, prompt, max_tokens: +$("maxtok").value || 64, mode }),
      signal: inflight.signal,
    });
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let acc = "";
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      acc += dec.decode(value, { stream: true });
      let nl;
      while ((nl = acc.indexOf("\n")) >= 0) {
        const line = acc.slice(0, nl); acc = acc.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "token") { buf += ev.text; tokens = ntokens(buf); lastBeat = Date.now(); renderConversation(prompt, buf, false); }
        else if (ev.type === "progress") { spent = ev.spent_msat; lastBeat = Date.now(); }
        else if (ev.type === "invoice") { lastBeat = Date.now(); showInvoice(prompt, ev); }
        else if (ev.type === "waiting") { lastBeat = Date.now(); $("status").innerHTML = "⏳ waiting for payment…"; }
        else if (ev.type === "failover") { selected = ev.to_pubkey; $("notice").textContent = `host unreachable — switching to ${ev.to_alias}…`; }
        else if (ev.type === "done") { finished = true; $("status").innerHTML = `done · ${aliasOf(selected)} · <b>${tokens}</b> tok · spent <b>${sat(ev.spent_msat)} sat</b> · ${(ev.latency_ms/1000).toFixed(1)}s`; }
        else if (ev.type === "error") {
          finished = true;
          if (ev.kind === "unreachable") { $("notice").textContent = "Host unreachable — try another host or press Refresh."; $("status").textContent = ""; }
          else if (ev.kind === "expired") { $("notice").textContent = "Invoice expired — press Send to get a new one."; $("status").textContent = ""; }
          else if (ev.kind === "payment_failed") { $("notice").textContent = "Payment failed — " + (ev.message || "") + " (host not penalized)"; $("status").textContent = ""; }
          else if (ev.kind === "serve_failed") {
            // host failed mid-stream AFTER payment: keep the partial output, show what was spent
            $("notice").textContent = "Host failed to serve (premature exit) — " + (ev.message || "");
            $("status").innerHTML = `host failed · spent <b>${sat(ev.spent_msat)} sat</b> for ${ev.delivered_tokens ?? "?"} tokens · no further chunks charged`;
          }
          else { renderConversation(prompt, "[error] " + ev.message, true); $("status").textContent = "failed"; }
        }
      }
    }
  } catch (e) {
    finished = true;
    if (e.name === "AbortError") {
      // User cancelled — host reputation stays neutral (server treats the disconnect as non-fault).
      $("notice").textContent = "Cancelled — stopped; no further chunks paid.";
      $("status").innerHTML = `cancelled · <b>${tokens}</b> tok · spent <b>${sat(spent)} sat</b> · ${secs()}s`;
    } else {
      $("notice").textContent = "Connection problem — try another host or press Refresh.";
      $("status").textContent = "";
    }
  } finally {
    clearInterval(ticker);
    inflight = null; busy = false; $("send").disabled = false; $("cancel").style.display = "none";
    loadHosts(); loadHistory();  // reflect reputation + the new session
  }
}

// --- wallet (NWC) ---
async function loadWallet() {
  let w = {};
  try { w = await (await fetch("/api/wallet")).json(); } catch {}
  payments = w.payments || "mock"; walletConnected = !!w.connected;  // drive auto pay-mode in send()
  // Default the BOLT11 toggle on when there's no automated payer (NWC selected but not connected).
  $("bolt11toggle").checked = (payments === "nwc" && !walletConnected);
  if (w.payments !== "nwc") { $("walletsec").style.display = "none"; return; }  // only relevant for PAYMENTS=nwc
  $("walletsec").style.display = "";
  if (w.connected && w.source === "env") {
    // Configured via NWC_URI in the environment — the GUI can't clear an env var.
    $("walletbody").innerHTML = `<div class="ok">● connected (via NWC_URI env)</div>`
      + `<div class="meta pk" style="font-family:monospace">${(w.wallet_pubkey||"").slice(0,24)}…</div>`
      + `<div class="note">Set via your environment. To change or remove it, unset/edit NWC_URI in your .env.client and restart — Disconnect can't clear a config-pinned wallet.</div>`;
  } else if (w.connected) {
    $("walletbody").innerHTML = `<div class="ok">● connected</div>`
      + `<div class="meta pk" style="font-family:monospace">${(w.wallet_pubkey||"").slice(0,24)}…</div>`
      + `<button id="nwcoff" class="link">Disconnect</button>`;
    $("nwcoff").onclick = async () => {
      await fetch("/api/wallet", {method:"DELETE"});
      loadWallet();  // returns to the connect/paste screen
    };
  } else {
    $("walletbody").innerHTML = `<input id="nwcin" placeholder="nostr+walletconnect://…">`
      + `<button id="nwcon" class="primary">Connect</button>`
      + `<div id="nwcerr" class="meta" style="color:var(--bad)"></div>`
      + `<div class="note">Pays from your own wallet (NWC). The app never holds funds.</div>`;
    $("nwcon").onclick = async () => {
      const uri = $("nwcin").value.trim(); if (!uri) return;
      const r = await fetch("/api/wallet", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({uri})});
      if (!r.ok) { $("nwcerr").textContent = (await r.json()).error || "invalid connection string"; return; }
      loadWallet();
    };
  }
}

$("refresh").onclick = loadHosts;
$("send").onclick = send;
$("cancel").onclick = () => { if (inflight) inflight.abort(); };  // abort the request -> server stops paying
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); });
// Mobile drawer (UI chrome only — no app logic): toggle the hosts/history sidebar.
$("drawertoggle").onclick = () => document.body.classList.toggle("drawer-open");
$("drawerscrim").onclick = () => document.body.classList.remove("drawer-open");
loadHosts(); loadHistory(); loadWallet();
</script>
</body>
</html>
